<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32-CAM — realtime дашборд</title>
<style>
:root{
  --bg:#0b0f14; --panel:#121821; --panel2:#0e141c; --line:#1f2a38;
  --text:#dbe4ee; --dim:#7d8ea3; --accent:#4cc2ff; --ok:#3ddc84;
  --warn:#ffb454; --bad:#ff5c69; --person:#ffd400; --animal:#ff7ab8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);
  box-shadow:0 0 8px var(--bad)}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px}
.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;
  color:var(--dim);margin:0 0 10px}
.video{position:relative;background:#000;border-radius:8px;overflow:hidden}
.video img{display:block;width:100%;height:auto}
.badge{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);
  padding:3px 8px;border-radius:6px;font-size:12px;display:flex;gap:8px}
.badge b{color:var(--accent)}
.nodet{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.55);
  padding:3px 8px;border-radius:6px;font-size:12px;color:var(--dim)}
/* --- індикація детекції --- */
.video.det{box-shadow:0 0 0 3px var(--ok),0 0 18px rgba(61,220,132,.55)}
.video.det-person{box-shadow:0 0 0 3px var(--person),0 0 22px rgba(255,212,0,.6)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
.pulse{animation:pulse 1.1s ease-in-out infinite}
.banner{position:absolute;top:8px;right:8px;display:flex;gap:6px;align-items:center;
  background:rgba(0,0,0,.6);border:1px solid var(--line);border-radius:8px;
  padding:5px 10px;font-size:13px;font-weight:600}
.banner .bdot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.banner.live .bdot{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.banner.person .bdot{background:var(--person);box-shadow:0 0 10px var(--person)}
.banner.person{border-color:var(--person);color:var(--person)}
.banner.live{border-color:var(--ok);color:var(--ok)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}
.kv div{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding:3px 0}
.kv span{color:var(--dim)}
.kv b{font-weight:600}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctl label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
.ctl input[type=range]{width:100%;accent-color:var(--accent)}
.ctl .val{font-size:12px;color:var(--text)}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:7px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);color:#002; border-color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:6px 8px;font-size:13px}
#events{max-height:220px;overflow-y:auto;font-size:13px}
.ev{padding:5px 8px;border-left:3px solid var(--line);margin:4px 0;
  background:var(--panel2);border-radius:0 6px 6px 0}
.ev.appear{border-color:var(--ok)} .ev.change{border-color:var(--warn)}
.ev.clear{border-color:var(--dim)}
.ev .t{color:var(--dim);font-size:11px;margin-right:6px}
.tag{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;
  margin-right:4px;background:rgba(255,212,0,.15);color:var(--person)}
.tag.animal{background:rgba(255,122,184,.15);color:var(--animal)}
#dets .d{display:flex;justify-content:space-between;padding:3px 0;
  border-bottom:1px dashed var(--line);font-size:13px}
.meter{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));width:0%}
.err{color:var(--bad);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="dot"></span> ESP32-CAM · realtime
    <span style="color:var(--dim);font-size:12px" id="clock"></span></h1>

  <div class="grid">
    <div>
      <div class="panel">
        <h2>Стрім · детекція</h2>
        <div class="video">
          <img id="video" src="/stream.mjpg" alt="стрім">
          <div class="badge">FPS <b id="fps">–</b> · рух
            <b id="motion">–</b>% · кадрів <b id="frames">–</b></div>
          <div class="nodet" id="nodet">об'єктів не виявлено</div>
          <div class="banner" id="banner"><span class="bdot"></span><span id="bannertext">детекція вимкнена</span></div>
        </div>
        <div class="meter"><i id="motionbar"></i></div>
        <div class="err" id="deterr"></div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>Виявлені об'єкти (realtime)</h2>
        <div id="dets"><span style="color:var(--dim)">—</span></div>
      </div>

      <div class="panel" style="margin-top:14px">
        <h2>Керування камерою</h2>
        <div class="ctl">
          <div><label>Яскравість <span class="val" id="v-brightness"></span></label>
            <input type="range" id="brightness" min="-2" max="2" step="1"></div>
          <div><label>Контраст <span class="val" id="v-contrast"></span></label>
            <input type="range" id="contrast" min="-2" max="2" step="1"></div>
          <div><label>Насиченість <span class="val" id="v-saturation"></span></label>
            <input type="range" id="saturation" min="-2" max="2" step="1"></div>
          <div><label>Якість JPEG <span class="val" id="v-quality"></span></label>
            <input type="range" id="quality" min="10" max="63" step="1"></div>
          <div><label>Ліміт FPS <span class="val" id="v-fps"></span></label>
            <input type="range" id="fps_limit" min="0" max="30" step="1"></div>
        </div>
        <div class="row">
          <label style="font-size:12px;color:var(--dim)">Роздільність
            <select id="framesize"></select></label>
          <button id="b-led">💡 LED</button>
          <button id="b-vflip">⇅ VFlip</button>
          <button id="b-hmirror">⇋ HMirror</button>
          <button id="b-snap">📸 Знімок</button>
        </div>
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Статус камери</h2>
        <div class="kv" id="status"></div>
      </div>
      <div class="panel" style="margin-top:14px">
        <h2>Журнал подій</h2>
        <div id="events"><span style="color:var(--dim)">порожньо</span></div>
      </div>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const FS=["qqvga","qqvga2","qcif","cif","qvga","vga","svga","xga","sxga","uxga","hd","fhd"];
let fsInit=false, ctlInit=false;

function ctl(varr,val){
  fetch('/api/control',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({var:varr,val:String(val)})})
    .then(r=>r.json()).then(j=>{ if(!j.ok) console.warn('control',varr,j); });
}
function bindRange(id,varr,fmt){
  const el=$(id);
  el.addEventListener('change',()=>ctl(varr,el.value));
  el.addEventListener('input',()=>$('v-'+id).textContent=fmt?fmt(el.value):el.value);
}
bindRange('brightness','brightness');
bindRange('contrast','contrast');
bindRange('saturation','saturation');
bindRange('quality','quality');
bindRange('fps_limit','fps',v=>v==0?'∞':v);

$('framesize').innerHTML=FS.map((n,i)=>`<option value="${n}">${n}</option>`).join('');
$('framesize').addEventListener('change',e=>ctl('framesize',e.target.value));
$('b-led').addEventListener('click',e=>{ctl('led',e.target.classList.contains('on')?0:1);});
$('b-vflip').addEventListener('click',()=>ctl('vflip','+1-0'));
$('b-hmirror').addEventListener('click',()=>ctl('hmirror','+1-0'));
$('b-snap').addEventListener('click',()=>{
  window.open('/api/snapshot','_blank');
});

function render(s){
  const cam=s.cam, det=s.detector;
  $('dot').className='dot'+(cam.online?' on':'');
  $('fps').textContent=det.fps;
  $('motion').textContent=det.motion_pct;
  $('motionbar').style.width=Math.min(100,det.motion_pct*4)+'%';
  $('frames').textContent=det.frames;
  $('deterr').textContent=det.error?('detector: '+det.error):'';

  // detections list
  const d=$('dets');
  if(!det.detections.length){d.innerHTML='<span style="color:var(--dim)">—</span>';}
  else d.innerHTML=det.detections.map(x=>{
    const [x1,y1,x2,y2]=x.box;
    return `<div class="d"><span><span class="tag ${x.cls=='person'?'':'animal'}">${x.cls}</span> ${(x.conf*100).toFixed(0)}%</span><span style="color:var(--dim)">[${x1},${y1} → ${x2},${y2}]</span></div>`;
  }).join('');
  $('nodet').style.display=det.detections.length?'none':'block';

  // --- індикація детекції: банер + рамка відео
  const hasPerson=det.detections.some(x=>x.cls=='person');
  const hasAnimal=det.detections.some(x=>x.cls!='person');
  const b=$('banner'), v=$('video').parentElement;
  b.classList.remove('live','person');
  v.classList.remove('det','det-person');
  if(hasPerson){
    b.classList.add('person','pulse');
    v.classList.add('det-person');
    $('bannertext').textContent='⚠ ЛЮДИНА ('+det.detections.filter(x=>x.cls=='person').length+')';
  }else if(hasAnimal){
    b.classList.add('live','pulse');
    v.classList.add('det');
    $('bannertext').textContent='🐾 тварина ('+det.detections.filter(x=>x.cls!='person').length+')';
  }else{
    b.classList.remove('pulse');
    $('bannertext').textContent='чисто';
  }

  // events
  if(s.events.length){
    $('events').innerHTML=s.events.slice().reverse().map(e=>{
      const t=new Date(e.t*1000).toLocaleTimeString('uk-UA');
      const tags=e.classes.map(c=>`<span class="tag ${c=='person'?'':'animal'}">${c}</span>`).join('');
      const label={appear:'зʼявився',change:'зміна',clear:'очистилось'}[e.type];
      return `<div class="ev ${e.type}"><span class="t">${t}</span>${label} ${tags||''}</div>`;
    }).join('');
  }

  // camera status kv
  const st=cam.status||{}, se=cam.settings||{};
  const rows=[
    ['онлайн', cam.online?'так':'НІ'],
    ['IP', st.ip||'—'],
    ['SSID', st.ssid||'—'],
    ['uptime', st.uptime_s?fmtDur(st.uptime_s):'—'],
    ['heap вільний', st.heap_free?Math.round(st.heap_free/1024)+' kB':'—'],
    ['клієнтів стріму', st.stream_clients??'—'],
    ['роздільність', se.framesize!=null?FS[se.framesize]||se.framesize:'—'],
    ['якість', se.quality??'—'],
    ['LED', se.led?'увімк.':'вимк.'],
    ['vflip / hmirror', (se.vflip??'—')+' / '+(se.hmirror??'—')],
    ['останній звʼязок', cam.last_ok_ago_s!=null?cam.last_ok_ago_s+' с тому':'—'],
  ];
  $('status').innerHTML=rows.map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');

  // init controls once
  if(!ctlInit && se.brightness!=null){
    ctlInit=true;
    $('brightness').value=se.brightness; $('v-brightness').textContent=se.brightness;
    $('contrast').value=se.contrast;     $('v-contrast').textContent=se.contrast;
    $('saturation').value=se.saturation; $('v-saturation').textContent=se.saturation;
    $('quality').value=se.quality;       $('v-quality').textContent=se.quality;
    const f=se.fps_limit_ms?Math.round(1000/se.fps_limit_ms):0;
    $('fps_limit').value=f; $('v-fps').textContent=f==0?'∞':f;
    $('framesize').value=FS[se.framesize]||'vga';
    $('b-led').classList.toggle('on',!!se.led);
    $('b-vflip').classList.toggle('on',!!se.vflip);
    $('b-hmirror').classList.toggle('on',!!se.hmirror);
  }
}
function fmtDur(s){
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);
  return (d?d+'д ':'')+h+'г '+m+'хв';
}
function tick(){
  fetch('/api/state').then(r=>r.json()).then(render)
    .catch(()=>{$('dot').className='dot';});
}
tick(); setInterval(tick,1000);
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('uk-UA'),1000);
</script>
</body>
</html>
